services:

  # ─────────────────────────────────────────────────────────────
  # 1. Сетевой шлюз — tun2socks проксирует трафик Android-контейнера
  # ─────────────────────────────────────────────────────────────
  tun2socks_1:
    image: xjasonlyu/tun2socks:v2.5.1
    command: --loglevel info --proxy ${PROXY_URL:-socks5://127.0.0.1:1080} --device tun0
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${ADB_PORT:-5555}:5555"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD-SHELL", "pgrep tun2socks"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - isolated_net

  # ─────────────────────────────────────────────────────────────
  # 2. Android-эмулятор (Кастомный билд с Magisk)
  # ─────────────────────────────────────────────────────────────
  android_1:
    # ВАЖНО: Здесь мы используем твою папку для сборки, а не просто скачиваем образ
    build:
      context: ./redroid_custom
      dockerfile: Dockerfile.redroid
    privileged: true
    shm_size: '2gb'
    depends_on:
      tun2socks_1:
        condition: service_healthy
    network_mode: "service:tun2socks_1"
    # ТВОЙ ПОЛНЫЙ БЛОК КОМАНД:
    command:
      - androidboot.redroid_adbd_root=1
      # --- Display ---
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      # --- Device Spoofing (задаётся через env из DEVICE_PROFILES) ---
      - ro.product.model=${RO_PRODUCT_MODEL:-Pixel 5}
      - ro.product.brand=${RO_PRODUCT_BRAND:-google}
      - ro.product.name=${RO_PRODUCT_NAME:-redfin}
      - ro.product.device=${RO_PRODUCT_DEVICE:-redfin}
      - ro.product.manufacturer=${RO_PRODUCT_MANUFACTURER:-Google}
      - ro.build.flavor=${RO_BUILD_FLAVOR:-redfin-user}
      - ro.build.type=${RO_BUILD_TYPE:-user}
      - ro.build.tags=${RO_BUILD_TAGS:-release-keys}
      - ro.build.description=${RO_BUILD_DESCRIPTION:-redfin-user 11 RQ3A.211001.001 7641976 release-keys}
      - ro.build.fingerprint=${RO_BUILD_FINGERPRINT:-google/redfin/redfin:11/RQ3A.211001.001/7641976:user/release-keys}
      # --- Dynamic HW identifiers ---
      - ro.serialno=${DEVICE_SERIAL:-SERIAL}
      - ro.build.id=${DEVICE_BUILD_ID:-BUILD}
      # --- SIM ---
      - gsm.sim.operator.numeric=${SIM_NUMERIC:-25001}
      - gsm.sim.operator.alpha=${SIM_ALPHA:-MTS}
      - gsm.sim.operator.iso-country=${SIM_ISO:-ru}
      - gsm.operator.numeric=${SIM_NUMERIC:-25001}
      - gsm.operator.alpha=${SIM_ALPHA:-MTS}
      - gsm.operator.iso-country=${SIM_ISO:-ru}
    volumes:
      - ./adb_keys/adbkey.pub:/data/misc/adb/adb_keys:ro
    environment:
      - TZ=${SYS_TIMEZONE:-Europe/Moscow}
      - ro.product.locale=${SYS_LOCALE:-ru-RU}
      - persist.sys.timezone=${SYS_TIMEZONE:-Europe/Moscow}

  # ─────────────────────────────────────────────────────────────
  # 3. Твой Python Контроллер (Новый блок)
  # ─────────────────────────────────────────────────────────────
  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    depends_on:
      - android_1
    volumes:
      - .:/app 
      - /var/run/docker.sock:/var/run/docker.sock # Дает контроллеру доступ к Докеру хоста
    environment:
      - REDROID_IP=android_1 # Хост для подключения по ADB внутри сети isolated_net
    networks:
      - isolated_net

networks:
  isolated_net:
    driver: bridge