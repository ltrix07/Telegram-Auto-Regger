services:
  regger:
    build: .
    container_name: tg_regger
    volumes:
      - ./sessions:/app/sessions
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
    networks:
      - tg_net
    depends_on:
      - android_1
    command: ["--count", "1", "--threads", "1"]

  android_1:
    image: redroid/redroid:11.0.0-latest
    container_name: android_1
    privileged: true
    networks:
      - tg_net
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_fps=30
    restart: always

networks:
  tg_net:
    driver: bridge