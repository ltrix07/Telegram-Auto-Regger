services:
  tun2socks_1:
    image: xjasonlyu/tun2socks:v2.5.1
    container_name: android_proxy_gateway_1
    command: --loglevel info --proxy ${PROXY_URL:-socks5://127.0.0.1:1080} --device tun0
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD-SHELL", "pgrep tun2socks"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  android_1:
    image: redroid/redroid:11.0.0-latest
    container_name: android_1
    privileged: true
    shm_size: '2gb'
    depends_on:
      - tun2socks_1
    network_mode: "service:tun2socks_1"
    
    dns:
      - 8.8.8.8
      - 1.1.1.1
    
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_fps=30
    environment:
      - ro.product.model=SM-G991U
      - ro.product.manufacturer=samsung
      - ro.product.brand=samsung
      - ro.product.name=o1qsqw
      - ro.product.device=o1q
      - ro.product.board=lahaina
      - ro.build.flavor=o1qsqw-user
      - ro.build.type=user
      - ro.build.tags=release-keys
      - ro.build.fingerprint=samsung/o1qsqw/o1q:11/RP1A.200720.012/G991USQU4AUF5:user/release-keys
      - ro.build.description=o1qsqw-user 11 RP1A.200720.012 G991USQU4AUF5 release-keys
      
      - ro.product.locale=en-US
      - persist.sys.timezone=America/New_York
      - TZ=America/New_York

      - ro.kernel.qemu=0
      
      - redroid.prop.ro.secure=1
      - redroid.prop.ro.debuggable=0

      - ro.product.locale=${SYS_LOCALE:-en-US}
      - persist.sys.timezone=${SYS_TIMEZONE:-America/New_York}
      - TZ=${SYS_TIMEZONE:-America/New_York}

      - gsm.sim.state=5 
      - gsm.sim.operator.numeric=${SIM_NUMERIC:-310260} 
      - gsm.sim.operator.alpha=${SIM_ALPHA:-T-Mobile} 
      - gsm.sim.operator.iso-country=${SIM_ISO:-us} 
      - gsm.operator.numeric=${SIM_NUMERIC:-310260}     
      - gsm.operator.alpha=${SIM_ALPHA:-T-Mobile}       
      - gsm.operator.iso-country=${SIM_ISO:-us}