services:
  android_1:
    image: redroid/redroid:11.0.0-latest
    container_name: android_1
    privileged: true
    ports:
      - "5555:5555"
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_fps=30
      - androidboot.use_memfd=1
    environment:
      # --- Уникальный отпечаток (Samsung Galaxy S21 / Android 11) ---
      - ro.product.model=SM-G991U
      - ro.product.manufacturer=samsung
      - ro.product.brand=samsung
      - ro.product.name=o1qsqw
      - ro.product.device=o1q
      - ro.product.board=lahaina
      - ro.build.flavor=o1qsqw-user
      - ro.build.type=user
      - ro.build.tags=release-keys
      - ro.build.fingerprint=samsung/o1qsqw/o1q:11/RP1A.200720.012/G991USQU4AUF5:user/release-keys
      - ro.build.description=o1qsqw-user 11 RP1A.200720.012 G991USQU4AUF5 release-keys
      
      # --- Настройки гео и таймзоны (под US прокси) ---
      - ro.product.locale=en-US
      - persist.sys.timezone=America/New_York
      - TZ=America/New_York

      # --- Базовые системные настройки ---
      - ro.kernel.qemu=0
      - ro.hardware.egl=adreno
      - ro.hardware.vulkan=adreno
      - redroid.prop.ro.secure=1
      - redroid.prop.ro.debuggable=0